      <h2 id="adminLoginTitle">Administrator access</h2>
      <p class="admin-login-copy">Enter the admin password to open the dashboard.</p>

      <form id="adminLoginForm">
        <label for="adminPassword">Password</label>

        <button class="admin-login-button" type="submit">Open dashboard <span aria-hidden="true">→</span></button>
      </form>

  <script>
    
    (function () {
      var input = document.getElementById("adminPassword");
      var button = document.getElementById("adminShowPassword");
      if (!input || !button) return;
      button.addEventListener("click", function () {
        var showing = input.type === "text";
        input.type = showing ? "password" : "text";
        button.textContent = showing ? "Show" : "Hide";
        button.setAttribute("aria-label", showing ? "Show password" : "Hide password");
        input.focus();
      });
    })();
  </script>
